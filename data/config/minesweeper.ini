'; minesweeper — Orx shell (lean). Menu → difficulty → playable grid.
; Gesture SM owns pan/zoom/reveal/flag/chord while PLAYING.

[Display]
Title           = Minesweeper
IconList        = logo.webp
FullScreen      = false
Decoration      = true
Smoothing       = true
VSync           = true
; Desktop smoke: Galaxy S22-ish portrait window
ScreenWidth     = 720
ScreenHeight    = 1280

[Resource]
; Desktop: ../data/... ; Android assets sync: texture/font/sound next to config/
Texture         = ../data/texture # texture # .
Font            = ../data/font # font # .
Sound           = ../data/sound # sound # .

[Clock]
AllowSleep      = false

[Config]
DefaultParent   = Default

[Default]
KeepInCache     = true

[Input]
KEY_ESCAPE      = Quit
KEY_EQUALS      = ZoomIn
KEY_MINUS       = ZoomOut
MOUSE_LEFT      = Reveal
MOUSE_RIGHT     = Flag
MOUSE_WHEEL_UP  = ZoomIn
MOUSE_WHEEL_DOWN = ZoomOut

[Main]
ViewportList    = MainViewport

[MainViewport]
Camera          = MainCamera
BackgroundColor = (40, 44, 52)

; Portrait phone frustum (Galaxy S22); SyncOrxCamera uses the same base.
[MainCamera]
FrustumWidth    = 720
FrustumHeight   = 1280
FrustumFar      = 2
FrustumNear     = 0
Position        = (0, 0, -1)

[Scene]
Unique          = true
; Menu objects created in C (ParentCamera reparents them off Scene).
; Senior: HUD mode button (Reveal/Flag/Question) slot — add under PLAYING, not menu.

[Title]
Graphic         = @
Text            = @
String          = Minesweeper
ParentCamera    = MainCamera
UseParentSpace  = true
Pivot           = center
Position        = (0, -0.38, 0)
Scale           = 0.9
Color           = (240, 240, 245)

[MenuBtn]
Graphic         = @
Text            = @
ParentCamera    = MainCamera
UseParentSpace  = true
Pivot           = center
Scale           = 0.55
Color           = (180, 210, 255)
; Size gives a reliable pick/hit box for text buttons
Size            = (520, 96, 0)

[BeginnerBtn@MenuBtn]
String          = Beginner   9x9 / 10
Position        = (0, -0.08, 0)

[IntermediateBtn@MenuBtn]
String          = Intermediate   16x16 / 40
Position        = (0, 0.05, 0)

[ExpertBtn@MenuBtn]
String          = Expert   16x30 / 99
Position        = (0, 0.18, 0)

; Explicit confirm — select difficulty first, then tap Play (Dev v3).
[PlayBtn@MenuBtn]
String          = Play
Position        = (0, 0.34, 0)
Scale           = 0.7
Color           = (120, 200, 140)
Size            = (400, 100, 0)

[BoardCell]
Graphic         = @
Text            = @
String          = #
Pivot           = center
Scale           = 0.45
Color           = (220, 220, 220)
Smoothing       = false

; Screen-fixed circular HUD (ParentCamera). Y-up: bottom-right = (+x, -y).
[ModeHud]
Graphic         = ModeHudGraphic
Text            = @
String          = *
ParentCamera    = MainCamera
UseParentSpace  = true
Pivot           = center
Position        = (0.36, -0.40, 0)
Scale           = 1.0
Color           = (255, 220, 120)
Smoothing       = false

[ModeHudGraphic]
Texture         = hud_circle.png
Pivot           = center
Scale           = 0.55
Smoothing       = false
